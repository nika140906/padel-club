# CI: the checks every change must pass.
#
# It runs on every push to a branch and on every pull request. The deploy
# workflow (added with Azure) also runs this same file first, through
# workflow_call, so main is only deployed when all of these jobs pass on
# that exact commit. CI never touches Azure: the tests use their own
# throwaway SQL Server container.
name: CI

on:
  push:
    branches-ignore: [main] # on main the deploy workflow runs this file, so it does not run twice
  pull_request:
  workflow_call:

# The jobs only read the code. Nothing here can push, comment or deploy.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      # The settings are in ruff.toml at the top of the repo.
      - run: ruff check services

  test:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # if one service fails, still show the other one's result
      matrix:
        service: [bookings, ladder]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      # Started first, because SQL Server takes about 20 seconds to be ready.
      # The password is made new for every run and hidden in the logs, so no
      # password is ever written in this file.
      - name: Start SQL Server
        run: |
          password="Ci-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=mssql://sa:$password@localhost:1433/${{ matrix.service }}_test" >> "$GITHUB_ENV"
          docker run --detach --name sql --publish 1433:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Wait for SQL Server
        run: |
          for _ in $(seq 60); do
            if docker exec --env SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" sql \
                 /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q "SELECT 1" -b -o /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not start within 2 minutes"
          docker logs sql
          exit 1

      # The tests make their own database (<service>_test) and run the migrations into it.
      - name: Run the tests, failing below 70% coverage
        run: pytest --cov=padel --cov=app --cov-report=term-missing --cov-fail-under=70

      # The brief asks for 70% on the core logic, so check the business rules
      # (each domain's service.py) on their own too, not only the whole service.
      - name: Check the core logic alone is at 70% or more
        run: coverage report --include="padel/*/service.py" --fail-under=70

  api-specs:
    name: Validate API and system files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install openapi-spec-validator==0.9.0 check-jsonschema==0.39.0
      # Checks each file against the OpenAPI 3.0 specification. The tests
      # (test_openapi.py) separately check that the files match the real routes.
      - run: openapi-spec-validator services/bookings/openapi.yaml services/ladder/openapi.yaml
      # Checks system.yaml against the course's schema. The tests
      # (test_system_yaml.py) separately check that it matches the code.
      - run: check-jsonschema --schemafile system.schema.json system.yaml

  build:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [bookings, ladder]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # A failed build fails the pipeline. The image is only built here;
      # pushing it to the registry is the deploy workflow's job.
      - uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          tags: padel-${{ matrix.service }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          push: false
          provenance: false # Azure Container Apps cannot pull images that carry provenance data
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  secrets:
    name: Scan for secrets (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # to list a pull request's commits
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch the whole history, so gitleaks can read every commit in this push or
          # pull request, not only the last one: a secret deleted in a later commit is still leaked.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # report in the run, without writing on the pull request
