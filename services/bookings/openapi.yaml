openapi: 3.0.3
info:
  title: Padel Club bookings service
  version: "2.0"
  description: |
    Member accounts (register, log in) and court bookings.
    Login returns a signed token. Send it as "Authorization: Bearer <token>"
    to this service and to the ladder service. The ladder service calls
    GET /auth/me on this service when a member joins the ladder.
    tests/test_openapi.py checks that this file lists exactly the routes in the code.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health of this service and its own database
      description: Reads and writes this service's database (the write is rolled back). Never calls the ladder service.
      security: []
      responses:
        "200":
          description: The database can be read and written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, db: ok, version: 538caa6 }
        "503":
          description: The database cannot be reached or used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: error, db: error, version: 538caa6 }

  /auth/register:
    post:
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/login:
    post:
      summary: Log in and get a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Logged in. The token is valid for 12 hours.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401":
          description: Wrong username or password (the same message for both)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/me:
    get:
      summary: The logged-in member
      description: Also called by the ladder service, with the member's own token, when the member joins the ladder.
      responses:
        "200":
          description: The member who owns the token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /courts:
    get:
      summary: List the club's courts
      responses:
        "200":
          description: All courts
          content:
            application/json:
              schema:
                type: object
                required: [courts]
                properties:
                  courts:
                    type: array
                    items: { $ref: "#/components/schemas/Court" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /courts/{court_id}/bookings:
    get:
      summary: One court's bookings on one day
      parameters:
        - name: court_id
          in: path
          required: true
          schema: { type: integer }
        - name: day
          in: query
          required: true
          schema: { type: string, format: date, example: "2030-06-01" }
      responses:
        "200":
          description: The bookings, earliest first (empty for an unknown court)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookings:
    post:
      summary: Book a court
      description: 60 or 90 minutes, starting on the hour or half hour, between 08:00 and 23:00, not in the past.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewBooking" }
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The court is already booked at that time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /bookings/mine:
    get:
      summary: The logged-in member's bookings
      responses:
        "200":
          description: My bookings, earliest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookings/{booking_id}:
    delete:
      summary: Cancel one of my bookings
      parameters:
        - name: booking_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [cancelled] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such booking, or it belongs to someone else
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The token from POST /auth/login

  responses:
    BadRequest:
      description: The request breaks a rule
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No token, or the token is fake or older than 12 hours
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: login required }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Health:
      type: object
      required: [status, db, version]
      properties:
        status: { type: string, enum: [ok, error] }
        db: { type: string, enum: [ok, error] }
        version: { type: string, description: "The Git commit the image was built from, or dev" }

    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9_]{3,30}$" }
        password: { type: string, minLength: 8 }

    Member:
      type: object
      required: [id, username]
      properties:
        id: { type: integer }
        username: { type: string }

    LoginResult:
      type: object
      required: [id, username, token]
      properties:
        id: { type: integer }
        username: { type: string }
        token: { type: string }

    Court:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string, example: Court 1 }

    NewBooking:
      type: object
      required: [court_id, start_time, duration_minutes]
      properties:
        court_id: { type: integer }
        start_time: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}$", example: "2030-06-01 18:00" }
        duration_minutes: { type: integer, enum: [60, 90] }

    Booking:
      type: object
      required: [id, court_id, user_id, start_time, end_time]
      properties:
        id: { type: integer }
        court_id: { type: integer }
        user_id: { type: integer }
        start_time: { type: string, example: "2030-06-01 18:00" }
        end_time: { type: string, example: "2030-06-01 19:30" }

    BookingList:
      type: object
      required: [bookings]
      properties:
        bookings:
          type: array
          items: { $ref: "#/components/schemas/Booking" }
